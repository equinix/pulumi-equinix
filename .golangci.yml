version: "2"

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - lll
    - staticcheck   # replaces megacheck
    - misspell
    - nakedret
    - unconvert
    - unused        # replaces deadcode, structcheck, varcheck

  exclusions:
    paths:
      - schema.go
      - resources.go
      - pulumiManifest.go

formatters:
  enable:
    - gofmt

run:
  timeout: 20m
