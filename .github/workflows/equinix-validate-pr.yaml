name: "Validate PR"

# Runs with the unprivileged `pull_request` trigger so no write token or secrets
# are exposed to PR-controlled input. Commenting on the PR is handled by
# equinix-validate-pr-comment.yaml, which runs via `workflow_run`.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the result to the commenting workflow. The error message derives from the
      # PR title, so it is passed via env and written to a file, never interpolated
      # into the script.
      - name: Write validation result
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ERROR_MESSAGE: ${{ steps.lint_pr_title.outputs.error_message }}
        run: |
          mkdir -p validation-result
          printf '%s' "$PR_NUMBER" > validation-result/pr-number
          if [ -n "$ERROR_MESSAGE" ]; then
            printf '%s' "$ERROR_MESSAGE" > validation-result/error-message
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-result
          path: validation-result
          retention-days: 1
