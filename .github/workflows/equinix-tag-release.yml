# Equinix-specific workflow: ci-mgmt leaves workflows prefixed with "equinix-" in place.
#
# Uses semantic-release (configured in .releaserc.json) to determine the next version from
# conventional commits, then pushes the tag. The tag push triggers the ci-mgmt managed
# release.yml, which builds, publishes and creates the GitHub release.
name: equinix-tag-release

on:
  workflow_dispatch:

concurrency:
  group: equinix-tag-release
  cancel-in-progress: false

permissions:
  # semantic-release verifies push access even in dry-run mode
  contents: write

jobs:
  tag:
    name: Tag next release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      # Dry run only: a full run would also create the GitHub release, which the ci-mgmt
      # publish workflow creates once the tag is pushed.
      - name: Determine next version
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          semantic_version: 19.0.5
          extra_plugins: |
            conventional-changelog-conventionalcommits@4.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so push with the bot token.
      - name: Push release tag
        if: steps.semantic_release.outputs.new_release_published == 'true'
        env:
          BOT_TOKEN: ${{ secrets.PULUMI_PROVIDER_AUTOMATION_TOKEN }}
          TAG: ${{ steps.semantic_release.outputs.new_release_git_tag }}
          SHA: ${{ steps.semantic_release.outputs.new_release_git_head }}
          REPO: ${{ github.repository }}
        run: |
          git tag "$TAG" "$SHA"
          git push "https://pulumi-bot:${BOT_TOKEN}@github.com/${REPO}" "refs/tags/${TAG}"
          echo "Pushed ${TAG} (${SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: No release needed
        if: steps.semantic_release.outputs.new_release_published != 'true'
        run: echo "No release-worthy commits since the last release" >> "$GITHUB_STEP_SUMMARY"
