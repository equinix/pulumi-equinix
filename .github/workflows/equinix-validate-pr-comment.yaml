name: "Validate PR comment"

# Posts (or clears) the PR title validation comment. Runs in the context of the
# default branch with a write token, so it must never check out or execute PR code.
# The only data taken from the PR is a validated PR number and the error text, which
# is only rendered as a comment body.
on:
  workflow_run:
    workflows: ["Validate PR"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Comment on PR title validation
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-result
          path: validation-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read validation result
        id: result
        run: |
          pr_number=$(tr -cd '0-9' < validation-result/pr-number)
          if [ -z "$pr_number" ]; then
            echo "Missing PR number" >&2
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          if [ -s validation-result/error-message ]; then
            {
              echo "Hey there and thank you for opening this pull request! 👋🏼"
              echo
              echo "We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted."
              echo
              echo "Details:"
              echo
              echo '```'
              cat validation-result/error-message
              echo
              echo '```'
            } > validation-result/comment.md
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.result.outputs.failed == 'true'
        with:
          header: pr-title-lint-error
          number: ${{ steps.result.outputs.pr_number }}
          path: validation-result/comment.md

      # Delete a previous comment when the issue has been resolved
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.result.outputs.failed != 'true'
        with:
          header: pr-title-lint-error
          number: ${{ steps.result.outputs.pr_number }}
          delete: true
