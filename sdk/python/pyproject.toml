[project]
  name = "pulumi_equinix"
  description = "A Pulumi package for creating and managing equinix cloud resources."
  dependencies = ["packaging>=24.0", "pulumi>=3.0.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "equinix", "category/cloud"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0a0+dev"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://deploy.equinix.com/"
    Repository = "https://github.com/equinix/pulumi-equinix"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_equinix = ["py.typed", "pulumi-plugin.json"]
